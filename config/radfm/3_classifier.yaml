# RadFM Organ Classifier Training Config
# Train organ-specific multi-label classifier on RadFM embeddings

# Embedding directories (generated by 2_embed_tokens)
embeddings_dir: /data/CTDoc_output/radfm_vision_embedding_bf16/train
val_embeddings_dir: /data/CTDoc_output/radfm_vision_embedding_bf16/val

# Label CSV
label_csv: /research/04-CT/00-RawData/CT-RATE/dataset/multi_abnormality_labels/train_predicted_labels.csv
val_label_csv: /research/04-CT/00-RawData/CT-RATE/dataset/multi_abnormality_labels/train_predicted_labels.csv

# Output
save_path: /data/CTDoc_output/radfm_organ_classifier.pt

# Model architecture - Cross-Attention Version
model_type: cross_attention
input_dim: 768  # RadFM raw encoder dimension (before projection)
hidden_dim: 1024
num_heads: 8
num_layers: 2
dropout: 0.1

# Visual Prompt Tuning - Disabled
prompt_type: none
num_visual_tokens: 32

# Training
batch_size: 64
epochs: 40
lr: 0.0001
weight_decay: 0.0001
eval_freq: 1
num_workers: 4
threshold: 0.5
